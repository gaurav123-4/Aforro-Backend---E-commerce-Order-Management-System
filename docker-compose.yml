version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: aforro_db
      POSTGRES_USER: aforro_user
      POSTGRES_PASSWORD: aforro_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aforro_user -d aforro_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data --clear &&
             gunicorn aforro_project.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: aforro_project.settings
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: django-insecure-aforro-secret-key
      DATABASE_URL: postgresql://aforro_user:aforro_password@db:5432/aforro_db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    command: celery -A aforro_project worker -l info
    volumes:
      - .:/app
    environment:
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: aforro_project.settings
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: django-insecure-aforro-secret-key
    depends_on:
      - redis
      - db
      
  celery-beat:
    build: .
    command: celery -A aforro_project beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: aforro_project.settings
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: django-insecure-aforro-secret-key
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
  redis_data:
